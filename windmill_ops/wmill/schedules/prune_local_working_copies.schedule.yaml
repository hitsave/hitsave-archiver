path: f/hitsave/prune_local_working_copies
# Daily 04:30 UTC (after the daily 03:00 Wasabi fixity run; it may start later while fixity
# still occupies the single Windmill worker). DELETES local copies (execute: "true"), enabled
# 2026-11-02 after the first scheduled dry run verified 50/50 packages (199.9 GB). Set back to
# "false" for a read-only report.
schedule: "0 30 4 * * *"
timezone: UTC
enabled: true
is_flow: false
script_path: f/hitsave/prune_local_working_copies
args:
  execute: 'true'
  min_age_days: 14
  max_packages: 50
  max_gb: 200
