path: f/hitsave/sync_catalog_snapshots
# Daily 05:30 UTC, after the 04:30 prune. A record edited in Omeka (by hand, the ledger's
# correction box, or a script) reaches its bag within a day. Pages through the Omeka item list
# (~45 API reads) and reads two small files per bag; writes only to bags whose record changed.
schedule: "0 30 5 * * *"
timezone: UTC
enabled: true
is_flow: false
script_path: f/hitsave/sync_catalog_snapshots
args:
  execute: 'true'
  max_writes: '0'
