path: f/hitsave/wasabi_fixity_check
# Daily 03:00 UTC: up to 300 packages, least-recently-checked first (owner request 2026-11-01).
# Each package is checked at most every 90 days (min_interval_days, owner decision 2026-11-02,
# in line with APTrust's Wasabi practice; see docs/storage-retention.md "Fixity schedule"). A full
# pass takes ~9 nights; after that the nightly run finds nothing due and exits in seconds until
# packages come due again. Newly ingested packages are never-checked, so always due.
# Packages average ~426 MB, so a pass night reads ~130 GB; max_gb 150 lets a typical night's
# 300 through. A full pass is ~1 TB per 90 days, far under Wasabi's free-egress allowance
# (egress <= active storage, ~7 TB stored).
# Packages too big for the remaining budget are skipped; the least-recently-checked one
# always runs first, so big packages are never starved.
schedule: "0 0 3 * * *"
timezone: UTC
enabled: true
is_flow: false
script_path: f/hitsave/wasabi_fixity_check
args:
  max_packages: 300
  max_gb: 150
  min_interval_days: 90
