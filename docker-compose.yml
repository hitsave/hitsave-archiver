# Preservation ingest stack (Postgres ledger, ClamAV, ingest worker, Omeka catalog register, ledger UI).
# Base images: Chainguard (cgr.dev) where available; ClamAV stays on Docker Hub (no public cgr.dev/clamav).
# Secrets and operator database.yaml: sibling private repo hitsave-archiver-config (see README).
name: hitsave-preservation

services:
  postgres:
    # Pinned to PostgreSQL 18.6 (image built 2026-10-12). Chainguard only publishes :latest, and a
    # major-version jump would leave the data dir unreadable. To upgrade: pg_dump (ledger_backup),
    # bump this digest, and restore if the major version changed.
    image: cgr.dev/chainguard/postgres:latest@sha256:4c8ef6bcf82ab05f4cca769d44847809fc069b5113893f3dc68b95983189a874
    restart: unless-stopped
    env_file:
      - config/preservation/generated.env
    volumes:
      # Ledger data on a host path (HOST_LEDGER_DATA) so it can be snapshotted and backed up.
      # create_host_path: false -> if the variable is missing, Postgres fails to start instead of
      # silently initialising an empty ledger in a fresh directory.
      - type: bind
        source: ${HOST_LEDGER_DATA:-./data/ledger}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - ./schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Ledger client: psql / pg_dump from the same image as the server, against host "postgres"
  # (the local ledger, or the forwarder in docker-compose.remote-ledger.yml).
  #   docker compose run --rm -T psql -tAc 'select count(*) from game_ingest'
  psql:
    image: cgr.dev/chainguard/postgres:latest@sha256:4c8ef6bcf82ab05f4cca769d44847809fc069b5113893f3dc68b95983189a874
    profiles: ["tools"]
    env_file:
      - config/preservation/generated.env
    environment:
      PGHOST: postgres
    entrypoint: ["sh", "-c", "export PGUSER=\"$$POSTGRES_USER\" PGPASSWORD=\"$$POSTGRES_PASSWORD\" PGDATABASE=\"$$POSTGRES_DB\"; exec psql \"$$@\"", "psql"]
    depends_on:
      postgres:
        condition: service_healthy

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
      - ./config/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ${HOST_PRESS_MATERIAL:-./data/press-material}:/data/press-material:ro
      - ${HOST_SUBMISSIONS:-./data/submissions}:/data/submissions:ro
      - ${HOST_INTAKE:-./data/intake}/ready:/data/intake/ready:ro

  ingest-worker:
    build:
      context: .
      dockerfile: ingest-worker/Dockerfile
    volumes:
      - ./config:/config:ro
      - ./config/preservation/generated:/config/preservation/generated
      - ${HITSAVE_PRIVATE_CONFIG:-../hitsave-archiver-config}/secrets:/config/secrets:ro
      - ${HITSAVE_PRIVATE_CONFIG:-../hitsave-archiver-config}/preservation/database.yaml:/config/preservation/database.yaml:ro
      - ./fixtures:/fixtures
      - ${HOST_PRESS_MATERIAL:-./data/press-material}:/data/press-material:ro
      - ${HOST_SUBMISSIONS:-./data/submissions}:/data/submissions
      - ${HOST_OUTPUT:-./data/output}:/output
      - ${HOST_INTAKE:-./data/intake}/ready:/data/intake/ready:ro
    extra_hosts:
      # LiteLLM on the host (config/dvd-menu-vlm.yaml base_url) for the DVD menu VLM ranking step.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started

  dvd-menu-preview:
    # DVD-Video menu still per staged package (remote-intake sweep, before ingest). Built from the
    # PRIVATE hitsave/dvd-menu-preview checkout (CSS descrambler: never vendor it into this public
    # repo or ingest-worker). No network; reads ready/ only and writes
    # <HOST_OUTPUT>/dvd-menu/<slug>/{menu_preview.jpg,result.json,candidates/} for build-bagit-package
    # (menu_preview.jpg, or contact_sheet.jpg for a disc without a usable menu) and the VLM ranking
    # step (scripts/rank_dvd_menu_vlm.py).
    image: hitsave/dvd-menu-preview:local
    build:
      context: ${HITSAVE_DVD_MENU_PREVIEW_SRC:-../hitsave-dvd-menu-preview}
    profiles: ["tools"]
    network_mode: none
    volumes:
      - ${HOST_INTAKE:-./data/intake}/ready:/data/intake/ready:ro
      - ${HOST_OUTPUT:-./data/output}/dvd-menu:/output

  disc-contents:
    # Files and web copies of a data-disc dump (PC/Mac press kits etc.), after ingest, for
    # scripts/build_disc_contents_bag.py. No network; reads ready/ only and writes
    # <HOST_OUTPUT>/disc-contents/<slug>/{files/,derived/,listing.json,result.json}.
    image: hitsave/disc-contents:local
    build:
      context: .
      dockerfile: disc-contents/Dockerfile
    profiles: ["tools"]
    network_mode: none
    volumes:
      - ${HOST_INTAKE:-./data/intake}/ready:/data/intake/ready:ro
      - ${HOST_OUTPUT:-./data/output}/disc-contents:/output

  omeka-catalog:
    build:
      context: .
      dockerfile: ingest-worker/Dockerfile
    entrypoint: ["python", "/app/scripts/register-dip-omeka-api.py"]
    environment:
      HITSAVE_CONFIG_ROOT: /config
    volumes:
      - ./config:/config:ro
      - ${HITSAVE_PRIVATE_CONFIG:-../hitsave-archiver-config}/omeka-catalog.yaml:/config/omeka-catalog.yaml:ro
      - ${HITSAVE_PRIVATE_CONFIG:-../hitsave-archiver-config}/secrets:/config/secrets:ro
      - ${HITSAVE_PRIVATE_CONFIG:-../hitsave-archiver-config}/preservation/database.yaml:/config/preservation/database.yaml:ro
      - ${HOST_OUTPUT:-./data/output}:/output:ro
      - ${HOST_INTAKE:-./data/intake}/ready:/data/intake/ready:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  ledger:
    # HitSave Ledger (staff dashboard). Production runs ghcr.io/hitsave/ledger behind
    # Caddy + oauth2-proxy (Pocket ID) on luigi; this service is for local use.
    image: ghcr.io/hitsave/ledger:local
    build:
      context: .
      dockerfile: ledger/Dockerfile
    ports:
      - "0.0.0.0:8090:8090"
    environment:
      HITSAVE_CONFIG_ROOT: /config
      HITSAVE_LEDGER_CONFIG: /run/hitsave/ledger.yaml
    volumes:
      - ./config:/config:ro
      - ./scripts:/app/scripts:ro
      - ./.generated:/archiver/.generated:ro
      # Outside /config so Docker never creates a placeholder config/ledger.yaml on the host.
      - ${HITSAVE_PRIVATE_CONFIG:-../hitsave-archiver-config}/ledger.yaml:/run/hitsave/ledger.yaml:ro
      # Intake failures (packages rejected before the ledger) for the Health page.
      - ${HOST_INTAKE:-./data/intake}/failed:/data/intake-failed:ro
      - ${HITSAVE_PRIVATE_CONFIG:-../hitsave-archiver-config}/omeka-catalog.yaml:/config/omeka-catalog.yaml:ro
      - ${HITSAVE_PRIVATE_CONFIG:-../hitsave-archiver-config}/secrets:/config/secrets:ro
      - ${HITSAVE_PRIVATE_CONFIG:-../hitsave-archiver-config}/preservation/database.yaml:/config/preservation/database.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  fixity-cron:
    build:
      context: .
      dockerfile: ingest-worker/Dockerfile
    entrypoint: ["python", "/app/scripts/fixity-check.py"]
    profiles: ["fixity"]
    volumes:
      - ./config/preservation:/config/preservation:ro
      - ${HITSAVE_PRIVATE_CONFIG:-../hitsave-archiver-config}/preservation/database.yaml:/config/preservation/database.yaml:ro
      - ${HOST_OUTPUT:-./data/output}:/output:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  clamav_data:
