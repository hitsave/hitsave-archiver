# Preservation ingest worker (paths inside containers). SSOT for container paths, ingest
# defaults, and preservation agent metadata — see docs/config-contract.md.
# Portable zip intake: config/preservation/submissions.yaml and docs/portable-submissions.md
paths:
  press_material_root: /data/press-material
  # SIP folders for ingest_kind analog (VHS/USA/…); defaults to press_material_root if unset.
  analog_material_root: /data/analog
  output_root: /output
  dip_subdir: dip
  bag_subdir: bag
  aip_subdir: aip
  processed_subdir: processed
  quarantine_subdir: quarantine

clamav:
  host: clamav
  port: 3310
  connect_timeout_seconds: 120

defaults:
  max_files: 5000
  # Cap total SIP payload hashed into one bag (bytes). 100 GiB covers DVD-9 + sidecars. Use 0 for no cap.
  max_total_bytes: 107374182400

# Source content policy (press folders and portable submissions via ingest-folder).
# enforce: false = log matches only (permissive test ingest); true = quarantine + abort.
content_policy:
  enforce: true
  blockers:
    booru_tagged_filenames:
      enabled: true
      # Match when filename starts with a post id and has at least this many "__" separators.
      min_double_underscore_segments: 3

preservation:
  repository_code: hitsave
  agent_name: HitSave archive ingest
  agent_version: ingest-folder.py

database:
  config_file: /config/preservation/database.yaml

# Unpacked BagIt prefixes under press-material/ (and dump layouts via ingest-kinds.yaml).
wasabi:
  enabled: true
  credentials_file: secrets/wasabi-credentials.yaml
  endpoint: https://s3.us-east-2.wasabisys.com
  region: us-east-2
  # Required: one bucket per layout (ingest kind dump → key dumps). No fallback bucket.
  buckets:
    press_material: hitsave-press-material
    dumps: hitsave-dumps
    other: hitsave-other
    analog: hitsave-analog
  verify_upload: true
