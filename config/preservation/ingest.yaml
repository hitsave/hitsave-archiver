# Preservation ingest worker (paths inside containers). SSOT for container paths, ingest
# defaults, and preservation agent metadata — see docs/config-contract.md.
# Portable zip intake: config/preservation/submissions.yaml and docs/portable-submissions.md
paths:
  press_material_root: /data/press-material
  output_root: /output
  dip_subdir: dip
  bag_subdir: bag
  aip_subdir: aip
  processed_subdir: processed
  quarantine_subdir: quarantine

clamav:
  host: clamav
  port: 3310
  connect_timeout_seconds: 120

defaults:
  max_files: 5000
  max_total_bytes: 5368709120

# Source content policy (press folders and portable submissions via ingest-game-folder).
# enforce: false = log matches only (permissive test ingest); true = quarantine + abort.
content_policy:
  enforce: true
  blockers:
    booru_tagged_filenames:
      enabled: true
      # Match when filename starts with a post id and has at least this many "__" separators.
      min_double_underscore_segments: 3

preservation:
  repository_code: hitsave
  agent_name: HitSave archive ingest
  agent_version: ingest-game-folder.py

database:
  config_file: /config/preservation/database.yaml

# E-ARK AIPs: unpacked package root under {prefix}{game_key}/ on Wasabi.
wasabi:
  enabled: true
  credentials_file: secrets/wasabi-credentials.yaml
  endpoint: https://s3.us-east-2.wasabisys.com
  region: us-east-2
  bucket: hitsave-incoming
  prefix: press-material/
  verify_upload: true
  # Omeka path for rclone mount of the whole bucket (archive folders = S3 prefixes).
  omeka_mount_root: /hitsave-incoming

# Legacy E-ARK: separate dip-access/ tar (ignored when packaging_mode is bagit).
dip_wasabi:
  enabled: true
  config_file: preservation/dip-wasabi.yml.example
