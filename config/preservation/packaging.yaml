# Normative packaging for Hit Save press ingest (RFC 8493 BagIt, unpacked on Wasabi).
# See docs/oais-bagit-preservation-plan.md

preservation:
  bagit:
    bagit_version: "1.0"
    payload_dir: data
    metadata_dir: metadata
    manifest_algorithm: sha256

  # PRONOM / format registry via Siegfried.
  format_identification:
    enabled: true
    tool: siegfried
    binary: sf
    pronom_registry_name: PRONOM

storage:
  wasabi:
    layout: bagit_unpacked
    unpacked_key_pattern: "{prefix}/{sort_letter}/{package_id}"
    unpacked_trailing_slash: true

validation:
  primary_tool: bagit-python
  bagit_validate: true
