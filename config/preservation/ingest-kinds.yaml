# Ingest kind → catalog enrichment (SSOT). Set on each game/submission YAML as ingest_kind.
# Moby API settings stay in mobygames.yaml; Omeka field mapping follows moby_omeka_profile here.
ingest_kinds:
  press_material:
    description: Community press kits under paths.press_material_root
    moby_enrich: true
    moby_omeka_profile: press_material
    storage_profile: bagit_unpacked
    wasabi_root: press-material

  dump:
    description: >-
      Preserved dumps (Redump disc images, ROM sets, install trees, coverdiscs, etc.).
      Unpacked BagIt prefix on Wasabi; Redump catalog when sidecar + SHA-1 evidence exists.
    moby_enrich: false
    moby_omeka_profile: game_catalog
    storage_profile: bagit_unpacked
    wasabi_root: dumps
    dump_layout:
      redump:
        submission_info_names:
          - "!submissionInfo.txt"
          - "!submissioninfo.txt"
          - submissionInfo.txt
          - submissioninfo.txt
        require_sections:
          - Common Disc Info
          - Size & Checksum
        require_fields:
          - System
          - Category
        require_checksums:
          - sha1
        path_pattern: "{system}/{category}/{sort_letter}/{package_id}"
      no_intro:
        # System value: DAT-o-MATIC label (https://datomatic.no-intro.org/), e.g. Nintendo - Nintendo 64
        submission_info_names:
          - dumpinfo.txt
          - dumpInfo.txt
          - "!dumpinfo.txt"
          - no-intro.txt
          - "!no-intro.txt"
          - nointro.txt
        require_fields:
          - Game name
          - System
        require_checksums:
          - sha1
          - md5
        path_pattern: "No-Intro/{system}/{sort_letter}/{package_id}"
      other:
        path_pattern: "Others/{sort_letter}/{package_id}"

  other:
    description: Generic SIP with no automatic Moby or Redump catalog step
    moby_enrich: false
    storage_profile: bagit_unpacked
    wasabi_root: other

  analog:
    description: Digitized analog material (scans, photos, tape transfers, etc.)
    moby_enrich: false
    moby_omeka_profile: none
    storage_profile: bagit_unpacked
    wasabi_root: analog
    # Folder tree under material root, e.g. VHS/USA/promotional/Nintendo/The Invasion of Nintendo
    wasabi_key_pattern: "{prefix}/{relative_sip_path}"
