# Packaged DIP browse/grid previews (metadata/hitsave/ in BagIt tar).
# Keep in sync with OmekaDipViewer DipConfig defaults.

dip_previews:
  manifest_inner_path: metadata/hitsave/preview-manifest.json
  hitsave_metadata_dir: metadata/hitsave

  gallery_max_bytes: 52428800
  browse_preview_max_bytes_per_image: 10485760
  collage_min_images: 4
  collage_max_images: 8

  grid_thumbnail_max_edge: 640
  grid_jpeg_quality: 88

  browse_canvas:
    medium: [640, 480]
    square: [400, 400]

  gallery_mime_types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp

  gallery_extensions:
    - jpg
    - jpeg
    - png
    - gif
    - webp
