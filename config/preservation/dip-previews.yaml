# Packaged DIP browse/grid previews (metadata/hitsave/ in unpacked BagIt on Wasabi).
# Keep in sync with OmekaDipViewer DipConfig defaults.

dip_previews:
  manifest_inner_path: metadata/hitsave/preview-manifest.json
  hitsave_metadata_dir: metadata/hitsave

  gallery_max_bytes: 52428800
  # Pillow decompression-bomb guard (default ~179M px). Press logos can exceed that (e.g. ~305M).
  max_image_pixels: 536870912
  browse_preview_max_bytes_per_image: 10485760
  collage_min_images: 4
  collage_max_images: 8

  grid_thumbnail_max_edge: 640
  grid_jpeg_quality: 88

  # Web-size display JPEG per gallery image (the lightbox shows this, never the original).
  display_max_edge: 2400
  display_jpeg_quality: 85

  # Images under these folder names (case-insensitive) are scans: always in the gallery, no
  # gallery_max_bytes cap (dump scans are often 100+ MB PNGs), listed on the item page.
  scan_dir_names:
    - Scans
  scan_max_bytes: 2147483648

  browse_canvas:
    medium: [640, 480]
    square: [400, 400]

  gallery_mime_types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp

  gallery_extensions:
    - jpg
    - jpeg
    - png
    - gif
    - webp
