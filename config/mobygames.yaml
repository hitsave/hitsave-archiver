# MobyGames API (optional). Copy mobygames-credentials.yaml from example.
mobygames:
  # Omeka field mapping (release date, description source) follows ingest_kind in
  # config/preservation/ingest-kinds.yaml — not this file.
  # Appended only when the attribution sentence does not already mention MobyGames.
  attribution_suffix: "Data by MobyGames.com"
  enabled: true
  api_base: https://api.mobygames.com/v1
  credentials_file: secrets/mobygames-credentials.yaml
  min_request_interval_seconds: 1.1
  # earliest_platform: one /games/{id}/platforms/{pid} call; all: merge companies from every platform.
  company_platform_scope: earliest_platform
  # When Moby has no synopsis: platform release descriptions from /games/{id}/platforms/{pid}, then HTML.
  fetch_ad_blurbs_api: true
  fetch_ad_blurbs_html: true
  # Optional Netscape cookie jar for curl (export from browser if Cloudflare blocks the host).
  page_cookie_jar: secrets/mobygames-cookies.txt
  ad_blurb_min_chars: 80
  # Legitimate press kits may have no Moby entry (cancelled games, obscure titles).
  # Record moby_status / block_reason on the ledger; do not abort ingest.
  block_on_failure: false
  search_title_from: folder_name
  # When API title search finds nothing: ddgs "{title} mobygames" → Moby URL → game id.
  web_search_fallback: true
