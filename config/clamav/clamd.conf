# HitSave preservation ingest — clamd overrides (bind-mounted over image defaults).
# SSOT map: docs/config-contract.md
# TCP port: config/preservation/ingest.yaml clamav.port (3310).
# Scan caps: keep aligned with config/preservation/submissions.yaml limits.*

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Archives: no caps (2026-11-01). MaxRecursion cannot exceed 100 (clamd hard maximum).
ScanArchive yes
MaxRecursion 100
MaxFiles 0
# Count limits: 0 here means literally zero (tested: PCREMatchLimit 0 disables regex signatures),
# so they are set very high instead. Byte limits below: 0 = unlimited.
MaxPartitions 1000000
MaxIconsPE 1000000
MaxRecHWP3 1000000
PCREMatchLimit 1000000000
PCRERecMatchLimit 1000000000
MaxEmbeddedPE 0
MaxHTMLNormalize 0
MaxHTMLNoTags 0
MaxScriptNormalize 0
MaxZipTypeRcg 0

# Scan every byte (2026-11-01). libclamav caps one object at ~2 GiB whatever these say, so
# scripts/clamav_full_scan.py streams larger files as disc-image members or overlapping raw
# chunks. 0 = no extra limit below that cap. (Upload size limits for web submissions live in
# config/preservation/submissions.yaml and are unaffected.)
StreamMaxLength 0
MaxFileSize 0
MaxScanSize 0
PCREMaxFileSize 0
# Never pass a file silently: any limit hit (recursion > 100, the ~2 GiB object cap) is reported
# as Heuristics.Limits.Exceeded.* and recorded as "not fully scanned", never as clean.
AlertExceedsMax yes
# Password-protected archives cannot be opened; without this clamd skips their contents and says
# clean. Reported as Heuristics.Encrypted.* -> "not fully scanned". (Encrypted *documents* are left
# alone: press PDFs often carry only an owner password and are still fully readable.)
AlertEncryptedArchive yes
# No scan time limit (the 2 min default reported unfinished scans as clean).
MaxScanTime 0
