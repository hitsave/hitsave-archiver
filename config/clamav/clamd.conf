# HitSave preservation ingest — clamd overrides (bind-mounted over image defaults).
# SSOT map: docs/config-contract.md
# TCP port: config/preservation/ingest.yaml clamav.port (3310).
# Scan caps: keep aligned with config/preservation/submissions.yaml limits.*

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Archives (zip submission unpack is scanned by clamd on shared /data mounts)
ScanArchive yes
MaxRecursion 10
MaxFiles 50000

# Scan every byte (2026-11-01). libclamav caps one object at ~2 GiB whatever these say, so
# scripts/clamav_full_scan.py streams larger files as disc-image members or overlapping raw
# chunks. 0 = no extra limit below that cap. (Upload size limits for web submissions live in
# config/preservation/submissions.yaml and are unaffected.)
StreamMaxLength 0
MaxFileSize 0
MaxScanSize 0
PCREMaxFileSize 0
# Never pass a file silently: a hit limit is reported as Heuristics.Limits.Exceeded.* (treated
# as "not fully scanned", never as clean). Per-object time cap 1 h instead of the 2 min default.
AlertExceedsMax yes
MaxScanTime 3600000
