# HitSave preservation ingest — clamd overrides (bind-mounted over image defaults).
# Ingest worker connects via TCP (see config/preservation/ingest.yaml clamav.host/port).
# Keep archive/file limits aligned with config/preservation/submissions.yaml limits.*

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Archives (zip submission unpack is scanned by clamd on shared /data mounts)
ScanArchive yes
MaxRecursion 10
MaxFiles 50000

# Large press videos (512 MiB — matches submissions.limits.max_member_bytes)
StreamMaxLength 536870912
MaxFileSize 536870912
MaxScanSize 536870912
PCREMaxFileSize 536870912
