# Omeka S REST API (omeka-catalog compose service). Not used by the Omeka web app itself.
# Visibility + ARK behavior on prod: hitsave-omeka-test docs/omeka-production.md
api:
  # Catalog register runs in Docker; local test stack listens on host :8088.
  base_url: http://host.docker.internal:8088/api
  credentials_file: secrets/omeka-api-credentials-local.yaml
  site_slug: hitsave-test
  # New catalog rows start private; publish from status-web ledger or set-omeka-visibility.py.
  # Local test E2E may override in a dev-only omeka-catalog overlay if anonymous browse is required.
  default_is_public: false
  item_set_title: Press and Marketing Materials

# S3-backed BagIt DIP media (OmekaDipViewer).
external_dip:
  dip_storage: wasabi-s3
  dip_ingester: omeka_dip_package

# Staff-only preservation URI on items (ledger package_storage_prefix → s3://…).
aip_wasabi:
  apply_uri_after_register: true
  uri_property: dcterms:relation
  uri_is_public: false

omeka_mariadb:
  container: hitsave-omeka-test-mariadb-1
  database: omeka_s

# Omeka app container (mount preflight via docker exec; requires /var/run/docker.sock on omeka-catalog).
omeka_app:
  container: hitsave-omeka-test-omeka-1

# Dump ingest (Redump sidecar + Moby): metadata-only Omeka items; files on Wasabi prefix.
dump_catalog:
  item_set_title: Dumps
  # item_set_id: optional; set in prod private config (e.g. Famitsu Wave = 511)
  resource_template_label: Press and Marketing Material
  ignore_ledger_omeka_item_id: false
  storage_uri_is_public: false
  is_public: true
  storage_uri_base: http://10.1.1.60:8088/staff/dumps
  # Disc pages and SHA-1 search on redump.info only (never redump.org).
  site_url: https://redump.info
  disc_url: "{site}/disc/{disc_id}"
  lookup_timeout_seconds: 30
  user_agent: HitSaveIntake/1.0
